# Despliegue en el NAS (QNAP / Container Station).
#   docker compose up -d --build
#
# Container Station antiguo puede pedir la clave "version"; si se queja,
# anade   version: "3.8"   como primera linea.
services:
  geotagger:
    build:
      context: .
      # Las rellena actualizar.sh. Si se construye a mano quedan en
      # "desconocido", y /api/version lo dice en vez de inventarse nada.
      args:
        GIT_COMMIT: ${GIT_COMMIT:-desconocido}
        GIT_BRANCH: ${GIT_BRANCH:-desconocido}
        BUILD_DATE: ${BUILD_DATE:-desconocido}
    image: geotagger:latest
    container_name: geotagger
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      # Raiz que la app puede recorrer. Tiene que coincidir con el montaje de
      # abajo: la app solo ve lo que este montado dentro del contenedor.
      NAS_ROOT: /share
      # Carpeta de trabajo inicial, relativa a NAS_ROOT (opcional: tambien se
      # elige desde la interfaz y queda guardada en settings.json).
      # WORK_ROOT: Multimedia/Fotos
      # Cuenta desde la que se envian los reportes por email (opcional).
      # SMTP_USER: tu@gmail.com
      # SMTP_PASS: contrasena-de-aplicacion
      # Tope de la cache de miniaturas y vistas previas, en MB (opcional).
      # Son ficheros regenerables: al pasarse se tiran los menos usados. Por
      # defecto 1024; con 0 se desactiva el tope y crece sin limite.
      # THUMB_CACHE_MAX_MB: 1024
    volumes:
      # El share del NAS montado en la MISMA ruta dentro y fuera. En QNAP las
      # carpetas de /share son symlinks a /share/CACHEDEV1_DATA/..., y solo
      # resuelven bien si la ruta dentro del contenedor es identica. Montarlo
      # en otra ruta (p. ej. /share:/nas) hace que las carpetas aparezcan en el
      # selector pero no se puedan abrir.
      - /share:/share
      # Ajustes y cache de miniaturas: que sobrevivan al recrear el contenedor.
      - geotagger_settings:/app/data

volumes:
  geotagger_settings:
    # Nombre explicito para reutilizar el volumen que ya existe en el NAS
    # (creado por el despliegue anterior). Si no existe, se crea.
    name: geotagger_geotagger_settings
